<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON TRANSLATE // SYSTEM v2.0</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ultron: {
                            dark: '#010409',
                            glass: 'rgba(5, 7, 15, 0.65)',
                            neon: '#00F0FF',
                            magenta: '#FF0055',
                            green: '#00FF88',
                            purple: '#D8B4FE',
                            border: 'rgba(0, 240, 255, 0.15)'
                        }
                    },
                    fontFamily: {
                        sans: ['Orbitron', 'Inter', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Futuristic Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #010409;
            position: relative;
            overflow: hidden;
            height: 100vh;
        }
        
        /* Cyber-Grid Hologram Background */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            pointer-events: none;
            z-index: 1;
        }

        /* Scanline Overlay */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 240, 255, 0.015) 50%,
                rgba(0, 240, 255, 0.015)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        .scifi-font {
            font-family: 'Orbitron', sans-serif;
        }
        .mono-font {
            font-family: 'Share Tech Mono', monospace;
        }
        
        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(5, 7, 15, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .glass-panel:hover {
            border-color: rgba(0, 240, 255, 0.35);
            box-shadow: 0 12px 40px rgba(0, 240, 255, 0.08);
        }

        /* Tech corner brackets */
        .tech-card {
            position: relative;
        }
        .tech-card::before, .tech-card::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: #00F0FF;
            border-style: solid;
            pointer-events: none;
            transition: border-color 0.3s ease;
        }
        .tech-card::before {
            top: -1px; left: -1px;
            border-width: 2px 0 0 2px;
        }
        .tech-card::after {
            bottom: -1px; right: -1px;
            border-width: 0 2px 2px 0;
        }

        /* Magenta tech corners for Vision panel */
        .vision-card::before, .vision-card::after {
            border-color: #FF0055;
        }

        /* Neon Borders */
        .neon-border-cyan {
            border: 1px solid #00F0FF !important;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
        .neon-border-magenta {
            border: 1px solid #FF0055 !important;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }
        .neon-border-green {
            border: 1px solid #00FF88 !important;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.35);
        }
        .neon-border-amber {
            border: 1px solid #F59E0B !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.35);
        }

        /* Scrollbars styling */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.4);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00F0FF;
        }

        .prose p { margin-bottom: 0.5rem; }
        .prose code { background: rgba(0,0,0,0.5); padding: 0.1em 0.3em; border-radius: 3px; font-family: monospace; color: #00F0FF; }
        .prose pre { background: rgba(0,0,0,0.8); padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1rem; border: 1px solid rgba(0, 240, 255, 0.2); }
    </style>
</head>
<body class="text-slate-200 select-none">

    <!-- Scanline and Flickering overlay -->
    <div class="scanline"></div>

    <!-- Three.js Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0 pointer-events-none"></div>

    <!-- Radial Glow overlay -->
    <div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,transparent_15%,#010409_85%)] pointer-events-none"></div>

    <!-- Hidden file uploaders -->
    <input type="file" id="docUploadInput" accept=".txt,.pdf,.docx,.md" class="hidden">
    <input type="file" id="audioUploadInput" accept=".mp3,.wav,.m4a" class="hidden">

    <!-- Main UI Layout wrapper -->
    <div class="relative z-10 h-screen flex flex-col justify-between p-6">
        
        <!-- Header HUD -->
        <header class="flex justify-between items-center glass-panel tech-card rounded-xl px-6 py-4 mb-4">
            <div class="flex items-center gap-3">
                <div class="relative flex h-3.5 w-3.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-ultron-neon opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-ultron-neon"></span>
                </div>
                <h1 class="text-lg md:text-2xl font-black tracking-[0.2em] text-transparent bg-clip-text bg-gradient-to-r from-ultron-neon via-sky-400 to-indigo-400 scifi-font uppercase">
                    ULTRON // TRANSLATE
                </h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="connectionStatus" class="mono-font text-xs text-ultron-neon tracking-widest border border-ultron-neon/30 px-3 py-1 rounded bg-ultron-neon/5">
                    CORE.ACTIVE // SYSTEM_ONLINE
                </div>
            </div>
        </header>

        <!-- Workspace Modules Grid -->
        <div class="flex-1 grid grid-cols-12 gap-6 min-h-0">
            
            <!-- MODULE 1: Translation Matrix -->
            <section class="col-span-12 lg:col-span-4 flex flex-col justify-between glass-panel tech-card rounded-2xl p-5">
                <div class="flex justify-between items-center border-b border-ultron-border pb-3 mb-4">
                    <h2 class="mono-font text-sm tracking-wider text-ultron-neon uppercase flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                        TRANSLATION.MATRIX
                    </h2>
                    
                    <button id="ocrToggleBtn" class="text-xs mono-font border border-ultron-magenta/40 px-3 py-1 rounded bg-ultron-magenta/5 text-ultron-magenta hover:bg-ultron-magenta/25 transition-all duration-300">
                        VISION SYSTEM
                    </button>
                </div>

                <!-- Input Text Box -->
                <div class="flex-1 flex flex-col mb-4">
                    <select id="sourceLang" class="bg-slate-950 border border-ultron-border text-slate-200 rounded px-3 py-2 outline-none text-xs font-semibold uppercase tracking-wider mb-2 cursor-pointer focus:border-ultron-neon focus:ring-1 focus:ring-ultron-neon transition-all">
                        <option value="auto">Auto Detect</option>
                    </select>
                    
                    <textarea id="sourceText" class="flex-1 bg-transparent text-sm resize-none outline-none placeholder-slate-600 border border-transparent focus:border-ultron-neon/15 p-2 rounded transition-colors font-medium" placeholder="Initialize textual input for translation..."></textarea>
                    
                    <div class="flex justify-between items-center mt-2 px-1">
                        <span id="charCount" class="mono-font text-xs text-slate-600">0 / 5000</span>
                        <div class="flex items-center gap-2">
                            <button id="translateMicBtn" class="p-2 rounded-full border border-ultron-neon/30 text-ultron-neon hover:bg-ultron-neon/15 transition-all duration-300 relative z-20 pointer-events-auto" title="Native Speech-to-Text">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Swipe Matrix Button -->
                <div class="relative h-px bg-ultron-border my-4">
                    <button id="swapLangBtn" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-950 border border-ultron-border rounded-full p-2.5 hover:border-ultron-neon hover:text-white text-ultron-neon transition-all duration-300 shadow-[0_0_15px_rgba(0,240,255,0.2)]">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>
                    </button>
                </div>

                <!-- Output Text Box -->
                <div class="flex-1 flex flex-col">
                    <select id="targetLang" class="bg-slate-950 border border-ultron-border text-slate-200 rounded px-3 py-2 outline-none text-xs font-semibold uppercase tracking-wider mb-2 cursor-pointer focus:border-ultron-neon focus:ring-1 focus:ring-ultron-neon transition-all">
                    </select>
                    
                    <div id="targetText" class="flex-1 bg-transparent text-sm text-slate-200 overflow-y-auto break-words p-2 border border-transparent font-medium"></div>
                    
                    <div class="flex justify-between items-center mt-2 px-1">
                        <span id="detectedLang" class="mono-font text-xs text-ultron-neon tracking-wider"></span>
                        <div class="flex items-center gap-2">
                            <button id="speakTargetBtn" class="p-2 rounded-full border border-ultron-neon/30 text-ultron-neon hover:bg-ultron-neon/15 transition-all duration-300 relative z-20 pointer-events-auto" title="Read Translated Output">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                            </button>
                            <button id="copyBtn" class="p-2 rounded-full border border-ultron-neon/30 text-ultron-neon hover:bg-ultron-neon/15 transition-all duration-300 relative z-20 pointer-events-auto" title="Copy Translation">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- MODULE 2: Middle Sphere Spacer & Vision OCR Panel -->
            <section id="middleSpacer" class="col-span-12 lg:col-span-4 flex flex-col justify-end items-center pb-8 relative pointer-events-none">
                <!-- Status text overlay -->
                <div class="absolute bottom-4 flex flex-col items-center gap-1.5 z-10">
                    <span id="aiStateLabel" class="mono-font text-xs tracking-[0.4em] text-ultron-neon/50 uppercase">IDLE.STATE</span>
                    <span id="transcriptLive" class="mono-font text-[10px] text-white/50 tracking-wider"></span>
                </div>
                
                <!-- OCR Vision Scanner Module (Hidden by default) -->
                <div id="ocrPanel" class="w-full h-full glass-panel tech-card vision-card rounded-2xl p-5 border border-ultron-magenta/50 hidden flex-col pointer-events-auto z-20">
                    <div class="flex justify-between items-center border-b border-ultron-magenta/40 pb-3 mb-4">
                        <h2 class="mono-font text-sm tracking-wider text-ultron-magenta uppercase">VISION.OCR_SCANNER</h2>
                        <button id="closeOcrBtn" class="text-slate-400 hover:text-white transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    
                    <div class="flex-1 flex flex-col items-center justify-center border border-dashed border-ultron-magenta/30 rounded-lg relative overflow-hidden bg-slate-950/50">
                        <input type="file" id="ocrInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div id="ocrPrompt" class="text-center p-4">
                            <svg class="w-12 h-12 mx-auto text-ultron-magenta/60 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            <p class="text-xs mono-font text-slate-400">UPLOAD DOCUMENT OR DROP FILE HERE</p>
                        </div>
                        <canvas id="ocrCanvas" class="absolute inset-0 w-full h-full object-contain hidden"></canvas>
                    </div>
                </div>
            </section>

            <!-- MODULE 3: AI Ultron Assistant -->
            <section class="col-span-12 lg:col-span-4 flex flex-col justify-between glass-panel tech-card rounded-2xl overflow-hidden pointer-events-auto">
                <!-- Title Header bar -->
                <div class="flex justify-between items-center border-b border-ultron-border/50 p-4 bg-slate-950/60">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-ultron-neon to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                            <svg class="w-5 h-5 text-black font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <div>
                            <h2 class="mono-font text-sm tracking-wider text-white">ULTRON_INTELLIGENCE</h2>
                            <p class="text-[9px] text-ultron-neon font-bold tracking-widest mono-font uppercase">COGNITIVE_GRID.V2</p>
                        </div>
                    </div>
                    
                    <!-- Web Search Toggle (Globe) -->
                    <button id="webSearchToggle" class="p-2 rounded border border-slate-700 text-slate-400 hover:border-ultron-neon hover:text-ultron-neon transition-all relative z-20 pointer-events-auto" title="Toggle Real-Time Web Search Context">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    </button>
                </div>

                <!-- Chat Dialog Area -->
                <div id="chatBox" class="flex-1 p-4 overflow-y-auto flex flex-col gap-4">
                    <div class="flex gap-3">
                        <div class="w-6 h-6 rounded-full bg-ultron-neon/20 flex-shrink-0 flex items-center justify-center mt-1">
                            <span class="text-[9px] text-white font-mono">U</span>
                        </div>
                        <div class="bg-slate-950/60 border border-ultron-border/20 rounded-2xl rounded-tl-sm p-3.5 text-xs text-slate-300 max-w-[85%] leading-relaxed">
                            Ultron neural system initialized. Web Speech API loaded. Requesting instructions.
                        </div>
                    </div>
                </div>

                <!-- Document Context Indicator Badge (RAG) -->
                <div id="docBadge" class="hidden px-4 py-2 mx-4 border border-ultron-border/30 rounded-xl bg-slate-950/70 flex items-center justify-between text-xs text-ultron-neon font-mono select-none">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <svg class="w-3.5 h-3.5 flex-shrink-0 text-ultron-neon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <span id="docBadgeName" class="truncate max-w-[180px]">document.txt</span>
                    </div>
                    <button id="clearDocBtn" class="text-slate-500 hover:text-ultron-magenta transition-colors pointer-events-auto">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <!-- Floating Chat Input Bar -->
                <div class="p-4 bg-transparent relative z-20 pointer-events-auto">
                    <div class="flex items-center gap-1.5 bg-slate-950/80 border border-ultron-border/40 rounded-full px-4 py-2.5 focus-within:border-ultron-neon focus-within:shadow-[0_0_15px_rgba(0,240,255,0.2)] transition-all duration-300">
                        <input type="text" id="chatInput" class="flex-1 bg-transparent outline-none text-xs text-slate-200 placeholder-slate-600 font-medium" placeholder="Inject neural inquiry query...">
                        
                        <!-- Auto-Listen Wake Word Toggle Button -->
                        <button id="autoListenToggleBtn" class="p-1 text-slate-500 hover:text-amber-500 transition-all rounded border border-transparent px-1.5 py-0.5 pointer-events-auto relative z-20" title="Toggle Background Auto-Listen (Hello Ultron)">
                            <span class="text-xs">👂</span>
                        </button>

                        <!-- Speaker Button -->
                        <button id="chatSpeakBtn" class="p-1 text-slate-500 hover:text-ultron-neon transition-colors" title="Speak Input Text">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                        </button>

                        <!-- Audio File Upload Button -->
                        <button id="chatAudioUploadBtn" class="p-1 text-slate-500 hover:text-ultron-neon transition-colors" title="Upload Audio File for Transcription">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                        </button>

                        <!-- File Upload Button (RAG) -->
                        <button id="chatDocUploadBtn" class="p-1 text-slate-500 hover:text-ultron-neon transition-colors" title="Upload Document for RAG Context">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        </button>
                        
                        <button id="chatMicBtn" class="p-1 text-slate-500 hover:text-ultron-magenta transition-colors" title="Voice Input Query">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </button>
                        
                        <button id="chatSendBtn" class="p-1 text-ultron-neon hover:text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                    </div>
                </div>
            </section>
            
        </div>
    </div>

    <!-- Load Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // --- 1. App State & Central HUD Controller ---
        const AppState = {
            aiState: 'IDLE', // IDLE, LISTENING, THINKING, RESPONDING
            webSearchActive: false,
            setAIState(state) {
                this.aiState = state;
                const label = document.getElementById('aiStateLabel');
                if (label) {
                    label.textContent = `${state}.STATE`;
                    if (state === 'LISTENING') {
                        label.className = "mono-font text-xs tracking-[0.4em] text-green-400 uppercase font-semibold";
                    } else if (state === 'THINKING') {
                        label.className = "mono-font text-xs tracking-[0.4em] text-ultron-magenta uppercase font-semibold animate-pulse";
                    } else if (state === 'RESPONDING') {
                        label.className = "mono-font text-xs tracking-[0.4em] text-purple-400 uppercase font-semibold";
                    } else {
                        label.className = "mono-font text-xs tracking-[0.4em] text-ultron-neon/50 uppercase";
                    }

        const vertexShader = `
            uniform float time;
            uniform float intensity;
            uniform float speed;
            varying vec3 vNormal;
            varying float vDisplacement;
            
            // Simplex noise implementation
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            
            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                          + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                          + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }
            
            void main() {
                vNormal = normal;
                float noise = snoise(vec3(position.x * 2.0, position.y * 2.0, position.z * 2.0 + time * speed));
                vec3 newPosition = position + normal * noise * intensity;
                vDisplacement = noise;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = "sine";
                osc1.frequency.setValueAtTime(880, ctx.currentTime);
                gain1.gain.setValueAtTime(0.08, ctx.currentTime);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start();
                osc1.stop(ctx.currentTime + 0.08);
                
                // Play second higher note after 80ms
                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = "sine";
                    osc2.frequency.setValueAtTime(1200, ctx.currentTime);
                    gain2.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);

            } finally {
                AppState.setAIState('IDLE');
            }
        });

        // Clear document context
        clearDocBtn.addEventListener('click', () => {
            uploadedDocText = "";
            uploadedDocName = "";
            docUploadInput.value = "";
            docBadge.classList.remove('flex');
            docBadge.classList.add('hidden');
        });

        // Play AI speak responses aloud with auto-detection of language
        async function speakChatResponse(text) {
            if (!text || !text.trim()) return;

            if (chatVoiceAudio) {
                chatVoiceAudio.pause();
                chatVoiceAudio = null;
            }

            AppState.setAIState('RESPONDING');
            try {
                const res = await fetch('/api/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, lang: "auto" })
                });
                if (!res.ok) throw new Error();

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                chatVoiceAudio = new Audio(url);
                chatVoiceAudio.playbackRate = 1.25; // Sleek and speedy voice
                chatVoiceAudio.onended = () => {
                    AppState.setAIState('IDLE');
                    URL.revokeObjectURL(url);
                    if (autoListenToggleBtn.dataset.active === "true") {
                        isAutoListenActive = false;
                        startWakeWordListening();
                    }
                };
                await chatVoiceAudio.play();
            } catch (err) {
                console.error("AI TTS playback failed:", err);
                AppState.setAIState('IDLE');
                if (autoListenToggleBtn.dataset.active === "true") {
                    isAutoListenActive = false;
                    startWakeWordListening();
                }
            }
        }

        function appendChatMessage(role, content) {
            const row = document.createElement('div');
            row.className = `flex gap-3 ${role === 'user' ? 'justify-end' : ''}`;
            
            if (role === 'user') {
                row.innerHTML = `
                    <div class="bg-indigo-950/60 border border-ultron-neon/30 rounded-2xl rounded-tr-sm p-3.5 text-xs text-slate-200 max-w-[85%] leading-relaxed">
                        ${content}
                    </div>
                `;
            } else {
                row.innerHTML = `
                    <div class="w-6 h-6 rounded-full bg-ultron-neon flex-shrink-0 flex items-center justify-center mt-1">
                        <span class="text-[9px] text-black font-bold font-mono">U</span>
                    </div>
                    <div class="bg-slate-900/60 border border-ultron-border/30 rounded-2xl rounded-tl-sm p-3.5 text-xs text-slate-300 max-w-[85%] prose prose-invert message-text leading-relaxed font-medium">
                        ${marked.parse(content)}
                    </div>
                `;
            }
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
            return row;
        }

        async function triggerChatRequest() {
            const query = chatInput.value.trim();
            if (!query) return;

            chatInput.value = '';
            
            // Render user query clean in chat dialogue box
            appendChatMessage('user', query);

            // Construct prompt context with uploaded document if one exists
            let promptContent = query;
            if (uploadedDocText) {
                promptContent = `[CONTEXT FROM UPLOADED DOCUMENT: ${uploadedDocName}]\n"""\n${uploadedDocText}\n"""\n\nUser Question: ${query}`;
            }

            chatHistory.push({ role: 'user', content: promptContent });

            AppState.setAIState('THINKING');

            const loaderRow = document.createElement('div');
            loaderRow.className = 'flex gap-3';
            loaderRow.innerHTML = `
                <div class="w-6 h-6 rounded-full bg-ultron-neon flex-shrink-0 flex items-center justify-center mt-1">
                    <span class="text-[9px] text-black font-bold font-mono">U</span>
                </div>
                <div class="bg-slate-900/60 border border-ultron-border/30 rounded-2xl rounded-tl-sm p-3.5 text-xs text-slate-300 max-w-[85%] prose prose-invert message-text leading-relaxed">
                    <span class="animate-pulse text-ultron-neon tracking-wider">COMPUTING RESPONSE MATRIX...</span>
                </div>
            `;
            chatBox.appendChild(loaderRow);
            chatBox.scrollTop = chatBox.scrollHeight;

            const textContainer = loaderRow.querySelector('.message-text');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: chatHistory,
                        webSearch: isSearchActive
                    })
                });

                if (!res.ok) throw new Error("Chat core connection failed.");

                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let responseAccumulator = "";
                textContainer.innerHTML = "";
                let buffer = ""; // SSE chunk accumulator

                while(true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    let boundary = buffer.indexOf('\n\n');
                    
                    while (boundary !== -1) {
                        const message = buffer.substring(0, boundary).trim();
                        buffer = buffer.substring(boundary + 2);
                        
                        if (message.startsWith('data: ')) {
                            try {
                                const payload = JSON.parse(message.substring(6));
                                if (payload.done) {
                                    chatHistory.push({ role: 'assistant', content: responseAccumulator });
                                    AppState.setAIState('IDLE');
                                    
                                    // Trigger automatic AI response read out loud
                                    speakChatResponse(responseAccumulator);
                                    break;
                                }
                                if (payload.content) {
                                    AppState.setAIState('RESPONDING');
                                    responseAccumulator += payload.content;
                                    textContainer.innerHTML = marked.parse(responseAccumulator);
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                                if (payload.error) {
                                    textContainer.innerHTML = `<span class="text-ultron-magenta">CHAT CORE FAIL: ${payload.error}</span>`;
                                }
                            } catch (e) {
                                console.error("JSON parse failure in chunk:", message, e);
                            }
                        }
                        boundary = buffer.indexOf('\n\n');
                    }
                }
            } catch (err) {
                textContainer.innerHTML = `<span class="text-ultron-magenta">SYSTEM FAILURE: LLAMA core connection lost.</span>`;
                AppState.setAIState('IDLE');
                if (autoListenToggleBtn.dataset.active === "true") {
                    isAutoListenActive = false;
                    startWakeWordListening();
                }
            }
        }

        chatSendBtn.addEventListener('click', triggerChatRequest);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') triggerChatRequest();
        });

        // Chat microphone recognition
        let chatRecognition = null;
        if (speechRecognition) {
            chatRecognition = new speechRecognition();
            chatRecognition.continuous = false;
            chatRecognition.interimResults = true;

            chatRecognition.onstart = () => {
                AppState.setAIState('LISTENING');
                isTranscribingChat = true;
                chatMicBtn.classList.remove('text-slate-500');
                chatMicBtn.classList.add('text-ultron-green');
            };

            chatRecognition.onresult = (e) => {
                let interim = '';
                let final = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                    else interim += e.results[i][0].transcript;
                }
                if (final) {
                    chatInput.value = final;
                    liveTranscriptLabel.textContent = "";
                    triggerChatRequest();
                } else if (interim) {
                    liveTranscriptLabel.textContent = `VOICE QUERY: "${interim}"`;
                }
            };

            chatRecognition.onerror = () => {
                stopChatRecognition();
            };

            chatRecognition.onend = () => {
                stopChatRecognition();
            };
        } else {
            chatMicBtn.style.display = 'none';
        }

        function stopChatRecognition() {
            if (chatRecognition && isTranscribingChat) {
                chatRecognition.stop();
                isTranscribingChat = false;
                chatMicBtn.classList.remove('text-ultron-green');
                chatMicBtn.classList.add('text-slate-500');
                liveTranscriptLabel.textContent = "";
                AppState.setAIState('IDLE');
                if (autoListenToggleBtn.dataset.active === "true") {
                    isAutoListenActive = false;
                    startWakeWordListening();
                }
            }
        }

        chatMicBtn.addEventListener('click', () => {
            if (!isTranscribingChat) {
                if (isAutoListenActive) {
                    isAutoListenActive = false;
                    if (wakeWordRecognition) {
                        try { wakeWordRecognition.stop(); } catch(e) {}
                    }
                }
                chatRecognition.lang = getSpeechLocale(sourceLang.value);
                chatRecognition.start();
            } else {
                stopChatRecognition();
            }
        });


        // --- 6. OCR Vision Module text rendering overlay ---
        const ocrInput = document.getElementById('ocrInput');
        const ocrCanvas = document.getElementById('ocrCanvas');
        const ocrPrompt = document.getElementById('ocrPrompt');

        document.getElementById('ocrToggleBtn').addEventListener('click', () => {
            const panel = document.getElementById('ocrPanel');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            }
        });

        document.getElementById('closeOcrBtn').addEventListener('click', () => {
            document.getElementById('ocrPanel').classList.add('hidden');
            document.getElementById('ocrPanel').classList.remove('flex');
        });

        ocrInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            const imageEl = new Image();
            imageEl.onload = () => {
                ocrCanvas.width = imageEl.width;
                ocrCanvas.height = imageEl.height;
                const ctx = ocrCanvas.getContext('2d');
                ctx.drawImage(imageEl, 0, 0);
                
                ocrPrompt.classList.add('hidden');
                ocrCanvas.classList.remove('hidden');
                ocrCanvas.classList.add('opacity-45'); // overlay dimness feedback
            };
            imageEl.src = url;

            AppState.setAIState('THINKING');

            const ocrForm = new FormData();
            ocrForm.append('image', file);
            ocrForm.append('target', targetLang.value);

            try {
                const res = await fetch('/api/ocr', {
                    method: 'POST',
                    body: ocrForm
                });
                const data = await res.json();
                
                if (res.ok) {
                    const ctx = ocrCanvas.getContext('2d');
                    ocrCanvas.classList.remove('opacity-45');
                    
                    // Fill translucent matrix grid overlay for scan result styling
                    ctx.fillStyle = 'rgba(2, 4, 9, 0.85)';
                    ctx.fillRect(0, 0, ocrCanvas.width, ocrCanvas.height);
                    
                    // Render cyan translated texts
                    ctx.fillStyle = '#00F0FF';
                    const fontSize = Math.max(16, Math.floor(ocrCanvas.width / 26));
                    ctx.font = `bold ${fontSize}px Orbitron, sans-serif`;
                    
                    const text = data.translated || 'No text extracted.';
                    const words = text.split(' ');
                    let line = '';
                    let y = fontSize * 1.5;
                    const x = 20;
                    const maxWidth = ocrCanvas.width - 40;
                    const lineHeight = fontSize * 1.35;

                    for(let n = 0; n < words.length; n++) {
                        let testLine = line + words[n] + ' ';
                        let metrics = ctx.measureText(testLine);
                        let testWidth = metrics.width;
                        if (testWidth > maxWidth && n > 0) {
                            ctx.fillText(line, x, y);
                            line = words[n] + ' ';
                            y += lineHeight;
                        } else {
                            line = testLine;
                        }
                    }
                    ctx.fillText(line, x, y);

                    // Sync translations instantly back to translator boxes
                    sourceText.value = data.extracted;
                    targetText.textContent = data.translated;
                    document.getElementById('charCount').textContent = `${data.extracted.length} / 5000`;
                } else {
                    alert("OCR matrix extraction failed: " + data.detail);
                }
            } catch (err) {
                alert("Vision matrix communication failure.");
            } finally {
                AppState.setAIState('IDLE');
                URL.revokeObjectURL(url);
            }
        });

        // Bootstrap Translate matrix setup
        initTranslationMatrix();
    </script>
</body>
</html>
